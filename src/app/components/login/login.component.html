<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-brand-mark"><mat-icon>forum</mat-icon></div>
    <p class="eyebrow">SAMCHAT</p>
    <h1 id="login-title">Boas-vindas</h1>
    <p class="login-description">Entre para conversar com seus contatos.</p>

    <form class="login-form" (ngSubmit)="login()">
      <div class="error-message" *ngIf="message" role="alert">{{ message }}</div>

      <label for="email">E-mail</label>
      <input id="email" type="email" [(ngModel)]="email" name="email"
        placeholder="voce@exemplo.com" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input id="senha" type="password" [(ngModel)]="senha" name="senha"
        placeholder="Digite sua senha" autocomplete="current-password" required>

      <button type="submit">
        Entrar
        <mat-icon>arrow_forward</mat-icon>
      </button>
    </form>
  </section>
</main>
