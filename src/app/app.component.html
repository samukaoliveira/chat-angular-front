<header class="toolbar" role="banner">
  <div class="brand-mark"><mat-icon>forum</mat-icon></div>
  <span class="brand-name">SamChat</span>
  <span class="brand-divider"></span>
  <span class="brand-section">Mensagens</span>
  <span class="spacer"></span>
  <div class="current-user" *ngIf="logado()" [attr.title]="nomeUsuario()">
    <span class="current-user-avatar">{{ iniciaisUsuario() }}</span>
    <span class="current-user-name">{{ nomeUsuario() }}</span>
  </div>
  <button mat-icon-button *ngIf="logado()" (click)="logout()" aria-label="Sair" title="Sair">
    <mat-icon>logout</mat-icon>
  </button>
</header>

<router-outlet></router-outlet>
